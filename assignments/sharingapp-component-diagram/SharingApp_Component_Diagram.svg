<text x="705" y="718.8897637795277" fill="#17324D" font-family="Helvetica,Arial,sans-serif" font-size="9" font-weight="normal" text-anchor="start">Solid connection = UML assembly connector</text>
<text x="40" y="745.8897637795277" fill="#17324D" font-family="Helvetica,Arial,sans-serif" font-size="10" font-weight="normal" text-anchor="start">Scope: the supplied Android code stores data locally using Gson and files. This diagram intentionally replaces that persistence with the remote architecture required by the assignment. No client connects directly to the database.</text>
<text x="40" y="784.8897637795277" fill="#64748B" font-family="Helvetica,Arial,sans-serif" font-size="9" font-weight="normal" text-anchor="start">Basis: Capstone 3 User Stories (US 1-21) and the assignment server/request description. Interface names and web-client internals are modeling choices; no database vendor, server framework or wire-data format is prescribed.</text>
