<text x="40" y="665.8897637795277" fill="#17324D" font-family="Helvetica,Arial,sans-serif" font-size="10" font-weight="bold" text-anchor="start">IDataAccess</text>
<text x="165" y="665.8897637795277" fill="#17324D" font-family="Helvetica,Arial,sans-serif" font-size="10" font-weight="normal" text-anchor="start">Provided by Remote Database; required by Application Server. Supports data retrieval and updates for users, items, bids and lending state.</text>
<text x="40" y="717.8897637795277" fill="#17324D" font-family="Helvetica,Arial,sans-serif" font-size="10" font-weight="bold" text-anchor="start">NOTATION</text>
