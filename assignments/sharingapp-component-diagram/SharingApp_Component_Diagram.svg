<text x="40" y="595.8897637795277" fill="#17324D" font-family="Helvetica,Arial,sans-serif" font-size="10" font-weight="bold" text-anchor="start">ISharingHTTP</text>
<text x="165" y="595.8897637795277" fill="#17324D" font-family="Helvetica,Arial,sans-serif" font-size="10" font-weight="normal" text-anchor="start">Provided by Web Server; required by both clients. Carries account/profile, item, search, bid and lending requests and responses.</text>
<text x="40" y="630.8897637795277" fill="#17324D" font-family="Helvetica,Arial,sans-serif" font-size="10" font-weight="bold" text-anchor="start">IApplicationAPI</text>
